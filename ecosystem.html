<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maine Defense Innovation Ecosystem Map</title>
<meta name="description" content="Organisations in Maine's defense innovation ecosystem, plotted by the town they sit in. Companion to the Maine Defense Innovation Ecosystem VC Landscape Map.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b0552a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fdf6e8' stroke-width='2'/%3E%3Cpath d='M20 12l-2.6 6.4L11 21l2.6-6.4z' fill='%23fdf6e8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/leaflet.css">
<link rel="stylesheet" href="./css/ecosystem.css">
</head>
<body>
<main id="app">
  <noscript>
    <div style="background:#101f36;border:1px solid #22384f;border-left:6px solid #d4763c;border-radius:8px;padding:18px;margin:24px;color:#eef3f9;font-family:system-ui,sans-serif">
      <b>This document needs JavaScript.</b>
      <p style="color:#a8c0dc">All content is bundled locally in the <code>data/</code> directory and nothing is
      fetched at runtime, so enabling scripts does not send any request off this machine. The map draws a
      coastline baked from OpenStreetMap vectors rather than calling a tile service.</p>
    </div>
  </noscript>
</main>

<!-- Map library. Loaded without a tile layer, from disk. -->
<script src="./vendor/leaflet.js"></script>

<!-- Data layer. Loaded before the application. No content lives in components. -->
<script src="./data/meta.js"></script>
<script src="./data/sources.js"></script>
<script src="./data/geo.js"></script>
<script src="./data/places.js"></script>
<script src="./data/formationChain.js"></script>
<script src="./data/anchorNodes.js"></script>
<script src="./data/clusters.js"></script>
<script src="./data/institutions.js"></script>
<script src="./data/testAssets.js"></script>
<script src="./data/capitalStack.js"></script>
<script src="./data/companies.js"></script>
<script src="./data/criticalContext.js"></script>
<script src="./data/gaps.js"></script>
<script src="./data/glossary.js"></script>

<!-- Application. -->
<script src="./js/components.js"></script>
<script src="./js/entities.js"></script>
<script src="./js/basemap.js"></script>
<script src="./js/ecosystem.js"></script>
</body>
</html>
